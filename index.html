}
button{

  margin-top:20px;

  width:100%;

  padding:18px;

  border:none;

  border-radius:20px;

  font-size:20px;

  cursor:pointer;

  background:linear-gradient(90deg,#06b6d4,#8b5cf6);

  color:white;

  transition:0.3s;

}

button:hover{

  transform:scale(1.02);

  box-shadow:0 0 30px rgba(0,255,255,0.4);

}

#result{

  margin-top:25px;

  min-height:120px;

  background:#0f172a;

  border-radius:20px;

  padding:20px;

  color:#cbd5e1;

  line-height:1.8;

  font-size:18px;

}
.app{
  width:100%;
  height:100vh;
  display:flex;
  background:#ffffff;
  color:#111827;
}

.sidebar{
  width:220px;
  height:100vh;
  border-right:1px solid #eef0f3;
  padding:24px 16px;
  background:#fafafa;
}

.model{
  padding:12px 14px;
  margin-bottom:8px;
  border-radius:12px;
  color:#6b7280;
  cursor:pointer;
  font-size:15px;
}

.model.active{
  background:#111827;
  color:white;
}

.model.disabled{
  opacity:0.35;
  cursor:not-allowed;
}

.main{
  flex:1;
  height:100vh;
  position:relative;
  background:#ffffff;
}

.chat-history{
  max-width:760px;
  margin:0 auto;
  padding:60px 20px 170px;
  height:100vh;
  overflow-y:auto;
}

.user-msg{
  max-width:520px;
  margin:0 0 26px auto;
  padding:14px 18px;
  border-radius:18px;
  background:#f3f4f6;
  color:#111827;
  line-height:1.8;
}

.ai-msg{
  max-width:680px;
  margin:0 0 32px 0;
  padding:0;
  background:transparent;
  color:#111827;
  line-height:1.9;
  font-size:16px;
}

.input-area{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:620px;
  transition:0.3s;
}

.input-area.active{
  top:auto;
  bottom:28px;
  transform:translateX(-50%);
}

.input-area textarea{
  width:100%;
  min-height:58px;
  max-height:130px;
  resize:none;
  border:1px solid #e5e7eb;
  outline:none;
  padding:18px 20px;
  border-radius:18px;
  background:#ffffff;
  color:#111827;
  font-size:16px;
  line-height:1.6;
  box-shadow:0 12px 40px rgba(0,0,0,0.08);
}

.input-area textarea::placeholder{
  color:#9ca3af;
}

.hint{
  margin-top:10px;
  font-size:12px;
  color:#9ca3af;
  text-align:center;
}
  margin-top:10px;
  font-size:13px;
  color:#64748b;
  text-align:center;
}
</style>

</head>

<body>


<div class="app">

  <aside class="sidebar">
    <div class="model active" data-model="deepseek-chat">DeepSeek Chat</div>
    <div class="model" data-model="deepseek-reasoner">DeepSeek R1</div>
    <div class="model disabled">GPT-4o</div>
    <div class="model disabled">Claude</div>
    <div class="model disabled">Gemini</div>
  </aside>

  <main class="main">
    <div id="chatHistory" class="chat-history"></div>

    <div class="input-area">
      <textarea
        id="question"
        placeholder="给 AI 发送消息..."
      ></textarea>
      <div class="hint">Enter 发送 · Shift + Enter 换行</div>
    </div>
  </main>

</div>

<script>
let currentModel = "deepseek-chat";

document.querySelectorAll(".model").forEach(item => {
  if (item.classList.contains("disabled")) return;

  item.addEventListener("click", () => {
    document.querySelectorAll(".model").forEach(m => m.classList.remove("active"));
    item.classList.add("active");
    currentModel = item.dataset.model;
  });
});

const input = document.getElementById("question");

input.addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    window.fakeAI();
  }
});

window.fakeAI = async function () {
  const q = input.value.trim();
  const chatHistory = document.getElementById("chatHistory");
  document.querySelector(".input-area").classList.add("active");

  if(!q) return;

  chatHistory.innerHTML += `<div class="user-msg">${q}</div>`;
  input.value = "";

  const loading = document.createElement("div");
  loading.className = "ai-msg";
  loading.innerHTML = "思考中...";
  chatHistory.appendChild(loading);
  chatHistory.scrollTop = chatHistory.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: q,
        model: currentModel
      })
    });

    const data = await res.json();
    loading.innerHTML = data.reply;
    chatHistory.scrollTop = chatHistory.scrollHeight;

  } catch (err) {
    loading.innerHTML = "连接失败：" + err.message;
  }
};
</script>

</body>
</html>
