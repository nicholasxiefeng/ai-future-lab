<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AI未来实验室</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  background:#050816;
  overflow:hidden;
  font-family:Arial;

  color:white;

}

/* 动态背景 */

.bg{

  position:fixed;
  width:100%;
  height:100vh;

  overflow:hidden;

}

.circle{

  position:absolute;
  border-radius:50%;

  background:rgba(0,255,255,0.15);

  animation:move 15s linear infinite;

  filter:blur(10px);

}

.circle:nth-child(1){
  width:300px;
  height:300px;
  left:10%;
  top:20%;
}

.circle:nth-child(2){
  width:200px;
  height:200px;
  right:10%;
  top:50%;
  animation-duration:20s;
}

.circle:nth-child(3){
  width:150px;
  height:150px;
  left:40%;
  bottom:10%;
  animation-duration:25s;
}

@keyframes move{

  0%{
    transform:translateY(0px) rotate(0deg);
  }

  50%{
    transform:translateY(-50px) rotate(180deg);
  }

  100%{
    transform:translateY(0px) rotate(360deg);
  }

}

/* 主界面 */

.container{

  position:relative;
  z-index:10;

  width:100%;
  min-height:100vh;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  padding:20px;

}

h1{

  font-size:70px;

  margin-bottom:20px;

  background:linear-gradient(90deg,#00ffff,#8b5cf6);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:0 0 30px rgba(0,255,255,0.5);

}

.subtitle{

  color:#94a3b8;

  margin-bottom:40px;

  letter-spacing:3px;

}

.chat-box{

  width:90%;
  max-width:900px;

  background:rgba(255,255,255,0.05);

  border:1px solid rgba(255,255,255,0.1);

  backdrop-filter:blur(20px);

  border-radius:30px;

  padding:30px;

  box-shadow:0 0 40px rgba(0,255,255,0.1);

}

textarea{

  width:100%;
  height:160px;

  background:#0f172a;

  border:none;

  border-radius:20px;

  padding:20px;

  color:white;

  font-size:18px;

  resize:none;

  outline:none;

}
.model-select{
  width:100%;
  margin-top:15px;
  padding:14px 18px;
  border:none;
  border-radius:16px;
  background:#0f172a;
  color:#67e8f9;
  font-size:16px;
  outline:none;
  box-shadow:0 0 20px rgba(0,255,255,0.15);
}

.chat-history{
  margin-top:25px;
  min-height:160px;
  max-height:360px;
  overflow-y:auto;
  background:#0f172a;
  border-radius:20px;
  padding:20px;
  color:white;
  line-height:1.8;
}

.user-msg{
  color:#67e8f9;
  margin-bottom:15px;
}

.ai-msg{
  color:#cbd5e1;
  margin-bottom:20px;
}

button{

  margin-top:20px;

  width:100%;

  ...
}
button{

  margin-top:20px;

  width:100%;

  padding:18px;

  border:none;

  border-radius:20px;

  font-size:20px;

  cursor:pointer;

  background:linear-gradient(90deg,#06b6d4,#8b5cf6);

  color:white;

  transition:0.3s;

}

button:hover{

  transform:scale(1.02);

  box-shadow:0 0 30px rgba(0,255,255,0.4);

}

#result{

  margin-top:25px;

  min-height:120px;

  background:#0f172a;

  border-radius:20px;

  padding:20px;

  color:#cbd5e1;

  line-height:1.8;

  font-size:18px;

}
.app{
  width:100%;
  height:100vh;
  display:flex;
  background:#050816;
  color:white;
}

.sidebar{
  width:220px;
  height:100vh;
  border-right:1px solid rgba(255,255,255,0.08);
  padding:24px 16px;
  background:rgba(255,255,255,0.03);
}

.model{
  padding:14px 16px;
  margin-bottom:10px;
  border-radius:14px;
  color:#94a3b8;
  cursor:pointer;
  font-size:15px;
  transition:0.25s;
}

.model:hover{
  background:rgba(255,255,255,0.08);
  color:white;
}

.model.active{
  background:linear-gradient(90deg,#06b6d4,#8b5cf6);
  color:white;
}

.model.disabled{
  opacity:0.35;
  cursor:not-allowed;
}

.main{
  flex:1;
  height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
}

.chat-history{
  flex:1;
  padding:60px 80px 160px;
  overflow-y:auto;
  background:transparent;
}

.user-msg{
  max-width:720px;
  margin:0 0 24px auto;
  padding:16px 20px;
  border-radius:18px 18px 4px 18px;
  background:linear-gradient(90deg,#06b6d4,#8b5cf6);
  color:white;
  line-height:1.8;
}

.ai-msg{
  max-width:760px;
  margin:0 auto 28px 0;
  padding:18px 22px;
  border-radius:18px 18px 18px 4px;
  background:rgba(255,255,255,0.06);
  color:#dbeafe;
  line-height:1.9;
  border:1px solid rgba(255,255,255,0.08);
}

.input-area{
  position:absolute;
  left:80px;
  right:80px;
  bottom:28px;
}

.input-area textarea{
  width:100%;
  min-height:68px;
  max-height:160px;
  resize:none;
  border:none;
  outline:none;
  padding:20px 22px;
  border-radius:22px;
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:17px;
  line-height:1.6;
  box-shadow:0 0 40px rgba(0,255,255,0.08);
}

.input-area textarea::placeholder{
  color:#64748b;
}

.hint{
  margin-top:10px;
  font-size:13px;
  color:#64748b;
  text-align:center;
}
</style>

</head>

<body>

<div class="bg">

  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>

</div>

<div class="app">

  <aside class="sidebar">
    <div class="model active" data-model="deepseek-chat">DeepSeek Chat</div>
    <div class="model" data-model="deepseek-reasoner">DeepSeek R1</div>
    <div class="model disabled">GPT-4o</div>
    <div class="model disabled">Claude</div>
    <div class="model disabled">Gemini</div>
  </aside>

  <main class="main">
    <div id="chatHistory" class="chat-history"></div>

    <div class="input-area">
      <textarea
        id="question"
        placeholder="给 AI 发送消息..."
      ></textarea>
      <div class="hint">Enter 发送 · Shift + Enter 换行</div>
    </div>
  </main>

</div>

<script>
let currentModel = "deepseek-chat";

document.querySelectorAll(".model").forEach(item => {
  if (item.classList.contains("disabled")) return;

  item.addEventListener("click", () => {
    document.querySelectorAll(".model").forEach(m => m.classList.remove("active"));
    item.classList.add("active");
    currentModel = item.dataset.model;
  });
});

const input = document.getElementById("question");

input.addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    window.fakeAI();
  }
});

window.fakeAI = async function () {
  const q = input.value.trim();
  const chatHistory = document.getElementById("chatHistory");

  if(!q) return;

  chatHistory.innerHTML += `<div class="user-msg">${q}</div>`;
  input.value = "";

  const loading = document.createElement("div");
  loading.className = "ai-msg";
  loading.innerHTML = "思考中...";
  chatHistory.appendChild(loading);
  chatHistory.scrollTop = chatHistory.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: q,
        model: currentModel
      })
    });

    const data = await res.json();
    loading.innerHTML = data.reply;
    chatHistory.scrollTop = chatHistory.scrollHeight;

  } catch (err) {
    loading.innerHTML = "连接失败：" + err.message;
  }
};
</script>

</body>
</html>
