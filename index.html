<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Tools</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:#ffffff;
  color:#111827;
  overflow:hidden;
}

.app{
  width:100vw;
  height:100vh;
  display:flex;
  background:#ffffff;
}

/* 左侧模型栏 */
.sidebar{
  width:180px;
  height:100vh;
  border-right:1px solid #eeeeee;
  background:#ffffff;
  padding:24px 16px;
}

.menu-title{
  font-size:13px;
  color:#9ca3af;
  margin-bottom:16px;
}

.model{
  padding:12px 14px;
  margin-bottom:8px;
  border-radius:12px;
  font-size:15px;
  color:#6b7280;
  cursor:pointer;
}

.model.active{
  background:#f3f4f6;
  color:#111827;
  font-weight:600;
}

.model.disabled{
  opacity:0.35;
  cursor:not-allowed;
}

/* 右侧主体 */
.main{
  flex:1;
  height:100vh;
  position:relative;
  background:#ffffff;
}

/* 顶部工具栏 */
.tool-bar{
  height:56px;
  display:flex;
  align-items:center;
  gap:32px;
  padding:0 48px;
  border-bottom:1px solid #eeeeee;
}

.tool{
  font-size:15px;
  color:#6b7280;
  cursor:pointer;
  height:56px;
  display:flex;
  align-items:center;
}

.tool.active{
  color:#111827;
  border-bottom:2px solid #111827;
}

/* 聊天区域 */
.chat-history{
  max-width:720px;
  height:100vh;
  margin:0 auto;
  padding:90px 20px 160px;
  overflow-y:auto;
}

.user-msg{
  max-width:520px;
  margin:0 0 28px auto;
  padding:14px 18px;
  border-radius:18px;
  background:#f3f4f6;
  color:#111827;
  line-height:1.8;
  font-size:16px;
}

.ai-msg{
  max-width:680px;
  margin:0 0 36px 0;
  padding:0;
  background:none;
  color:#111827;
  line-height:1.9;
  font-size:16px;
}

/* 输入框：第一次居中 */
.input-area{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:560px;
  transition:0.25s ease;
}

/* 发送后到底部 */
.input-area.active{
  top:auto;
  bottom:28px;
  transform:translateX(-50%);
}

.input-area textarea{
  width:100%;
  min-height:58px;
  max-height:140px;
  resize:none;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:18px 20px;
  outline:none;
  font-size:16px;
  line-height:1.6;
  background:#ffffff;
  color:#111827;
}

.input-area textarea::placeholder{
  color:#9ca3af;
}

.hint{
  margin-top:10px;
  text-align:center;
  font-size:12px;
  color:#9ca3af;
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="menu-title">模型</div>

    <div class="model active" data-model="deepseek-chat">DeepSeek Chat</div>
    <div class="model" data-model="deepseek-reasoner">DeepSeek R1</div>
    <div class="model disabled">GPT-4o</div>
    <div class="model disabled">Claude</div>
    <div class="model disabled">Gemini</div>
  </aside>

  <main class="main">

    <div class="tool-bar">
      <div class="tool active">聊天</div>
      <div class="tool">画图</div>
      <div class="tool">视频</div>
      <div class="tool">TikTok选品</div>
      <div class="tool">海报生成</div>
    </div>

    <div id="chatHistory" class="chat-history"></div>

    <div class="input-area">
      <textarea id="question" placeholder="给 AI 发送消息..."></textarea>
      <div class="hint">Enter 发送 · Shift + Enter 换行</div>
    </div>

  </main>

</div>

<script>
let currentModel = "deepseek-chat";

document.querySelectorAll(".model").forEach(item => {
  if(item.classList.contains("disabled")) return;

  item.addEventListener("click", () => {
    document.querySelectorAll(".model").forEach(m => m.classList.remove("active"));
    item.classList.add("active");
    currentModel = item.dataset.model;
  });
});

document.querySelectorAll(".tool").forEach(item => {
  item.addEventListener("click", () => {
    document.querySelectorAll(".tool").forEach(t => t.classList.remove("active"));
    item.classList.add("active");
  });
});

const input = document.getElementById("question");
const chatHistory = document.getElementById("chatHistory");
const inputArea = document.querySelector(".input-area");

input.addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

async function sendMessage(){
  const q = input.value.trim();
  if(!q) return;

  inputArea.classList.add("active");

  chatHistory.innerHTML += `<div class="user-msg">${q}</div>`;
  input.value = "";

  const loading = document.createElement("div");
  loading.className = "ai-msg";
  loading.innerHTML = "思考中...";
  chatHistory.appendChild(loading);
  chatHistory.scrollTop = chatHistory.scrollHeight;

  try{
    const res = await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        question:q,
        model:currentModel
      })
    });

    const data = await res.json();
    loading.innerHTML = data.reply || "没有返回内容";
    chatHistory.scrollTop = chatHistory.scrollHeight;

  }catch(err){
    loading.innerHTML = "连接失败：" + err.message;
  }
}
</script>

</body>
</html>
